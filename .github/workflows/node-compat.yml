name: Node Compatibility

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck
        working-directory: .

      - name: Build
        run: pnpm build

      - name: Check build output
        if: ${{ success() }}
        run: |
          set -e
          if [ -d ".vercel/output" ]; then
            echo "✅ Build successful - Vercel output found at .vercel/output"
            ls -la .vercel/output/
          elif [ -d ".output" ]; then
            echo "✅ Build successful - Nitro output found at .output"
            ls -la .output/
          elif [ -d "dist" ]; then
            echo "✅ Build successful - static output found at dist"
            ls -la dist/
          elif [ -d ".nuxt" ]; then
            echo "ℹ️ Nuxt build artifacts found at .nuxt"
            ls -la .nuxt/
          else
            echo "❌ Build failed - no known output directory found (.vercel/output, .output, dist, .nuxt)"
            ls -la
            exit 1
          fi